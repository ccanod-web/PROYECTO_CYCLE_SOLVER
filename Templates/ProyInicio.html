<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cycle Solver</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Ubuntu', sans-serif;
      background: linear-gradient(45deg, #FFA3C5 15%, #D5B2EB 85%);
      color: #0C0A09;
      min-height: 120vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 60px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 16px;
      color: black;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }

    p {
      font-size: 1.1rem;
      margin-bottom: 24px;
      opacity: 0.9;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #262626;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.2);
      color: #262626;
      transition: all 0.3s;
    }

    input[type="text"]::placeholder {
      color: #52525C;
    }

    input[type="text"]:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
    }

    .button-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 20px;
    }

    button, .btn-link {
      background: white;
      color: #262626;
      font-weight: bold;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    button:hover, .btn-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
    }

    .info {
      margin-top: 30px;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .example {
      background: rgba(0, 0, 0, 0.2);
      padding: 10px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 0.9em;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Cycle Solver</h1>
    <p>Calculador de ciclos de Euler y Hamilton en grafos.</p>

    <form method="post">
      <div class="form-group">
        <label for="nombre">Nombre del Ejercicio</label>
        <input type="text" id="nombre" name="nombre" placeholder="Grafo No.1" required />
      </div>
      <div class="form-group">
        <label for="nodos">Nodos (separados por comas)</label>
        <input type="text" id="nodos" name="nodos" placeholder="1,2,3,4" required />
      </div>
      <div class="form-group">
        <label for="aristas">Aristas</label>
        <input type="text" id="aristas" name="aristas" placeholder="(1,2),(2,3),(3,4)" required />
      </div>

      <div class="button-group">
        <button type="submit">Analizar Grafos</button>
        <a href="{{ url_for('historial') }}" class="btn-link">Historial</a>
      </div>
    </form>
  </div>
</body>
</html>
